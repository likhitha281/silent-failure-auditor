[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-failure-auditor"
version = "0.1.0"
description = "Catches when a coding agent silently fails and reports success anyway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Likhitha" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
sfa = "silent_failure_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["silent_failure_auditor*"]
